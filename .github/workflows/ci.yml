name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2.0"

      - name: Add Rocq opam repository
        run: opam repo add rocq-released https://rocq-prover.org/opam/released

      # Pins matching the local cert-yjs switch.
      - name: Pin dependencies
        run: |
          opam pin add -n -y rocq-stdpp "git+https://gitlab.mpi-sws.org/iris/stdpp.git#6151984a1e2770649858f9d578023ffc1b337421"
          opam pin add -n -y rocq-iris "git+https://gitlab.mpi-sws.org/iris/iris.git#1e6e3a57d8ad52b880633cc69c979ff7e65d6fbc"
          opam pin add -n -y iris-named-props "git+https://github.com/tchajed/iris-named-props.git#ca663d2709888a789a03edc861b7bde86ddd56e5"
          opam pin add -n -y coq-record-update "git+https://github.com/tchajed/coq-record-update.git#7b2645210331c3ec4ed75fa5ad0840a723f25151"

      - name: Install dependencies
        run: opam install -y coq.9.1.1 rocq-iris iris-named-props coq-record-update

      - name: Build
        run: opam exec -- make
